# Manual inventory ingest — calls the backend's CRON_SECRET-gated ingest endpoint.
#
# The scheduled trigger is DISABLED. Ingest is now driven by the always-on Railway
# server's in-process scheduler (backend/src/scheduler.ts), which is a far more
# reliable clock than GitHub Actions — GitHub's `schedule:` was dropping ~80% of
# runs for this repo, firing every 2-3h instead of every 30m and letting the feed
# go stale. This workflow is kept only for manual/on-demand runs from the Actions
# tab (workflow_dispatch). Do NOT re-enable `schedule:` while the in-process
# scheduler is on, or the ingest will double-run.
#
# Requires a repo secret CRON_SECRET (Settings -> Secrets and variables ->
# Actions) equal to the backend's CRON_SECRET in Railway.
name: ingest

on:
  # schedule: DISABLED — see header. Driven by backend/src/scheduler.ts instead.
  #   - cron: "9,24,39,54 * * * *"
  workflow_dispatch: {} # manual runs only, from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set"; exit 1
          fi
          # -sS: quiet but show errors. Capture body + HTTP status separately.
          body=$(curl -sS -m 600 -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://api.radiia.co/cron/ingest/diamonds)
          status=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $status"
          echo "$payload"
          if [ "$status" != "200" ]; then
            echo "Ingest failed (HTTP $status)"; exit 1
          fi
