# Hourly inventory ingest — calls the backend's CRON_SECRET-gated ingest endpoint.
# Replaces the old Vercel ingest cron. Add a repo secret CRON_SECRET (Settings ->
# Secrets and variables -> Actions) equal to the backend's CRON_SECRET in Railway.
name: ingest

on:
  schedule:
    # Every 30 minutes (UTC), matching the original Vercel `*/30` cadence.
    # Note: GitHub scheduled runs can lag (or rarely skip) under load, especially
    # at :00 — so real arrival times drift a few minutes past :00/:30.
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set"; exit 1
          fi
          # -sS: quiet but show errors. Capture body + HTTP status separately.
          body=$(curl -sS -m 600 -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://api.radiia.co/cron/ingest/diamonds)
          status=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $status"
          echo "$payload"
          if [ "$status" != "200" ]; then
            echo "Ingest failed (HTTP $status)"; exit 1
          fi
